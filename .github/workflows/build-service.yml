name: Build & Push Service

on:
  workflow_call:
    inputs:
      service:
        required: true
        type: string
      path:
        required: true
        type: string
      docker_tag:
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 18

      - uses: actions/cache@v4
        with:
          path: ${{ inputs.path }}/node_modules
          key: ${{ runner.os }}-${{ hashFiles(format('{0}/package-lock.json', inputs.path)) }}

      - run: |
          cd ${{ inputs.path }}
          npm install
          npm test

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - uses: docker/build-push-action@v5
        with:
          context: ./${{ inputs.path }}
          push: true
          tags: ${{ inputs.docker_tag }}
          cache-from: type=registry,ref=${{ inputs.docker_tag }}:cache
          cache-to: type=registry,ref=${{ inputs.docker_tag }}:cache,mode=max

      - uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: ${{ inputs.docker_tag }}
          format: table
          exit-code: 0
          severity: CRITICAL,HIGH
          ignore-unfixed: true
