name: Build Service

on:
  workflow_call:
    inputs:
      service:
        required: true
        type: string
    secrets:
      DOCKER_USERNAME:
        required: true
      DOCKER_PASSWORD:
        required: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Cache npm dependencies
        uses: actions/cache@v4
        id: npm-cache
        with:
          path: ${{ inputs.service }}/node_modules
          key: ${{ runner.os }}-npm-${{ inputs.service }}-${{ hashFiles(format('{0}/package-lock.json', inputs.service)) }}
          restore-keys: ${{ runner.os }}-npm-${{ inputs.service }}-

      - name: Install dependencies
        if: steps.npm-cache.outputs.cache-hit != 'true'
        run: cd ${{ inputs.service }} && npm ci

      - name: Run tests
        run: cd ${{ inputs.service }} && npm test

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and load Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./${{ inputs.service }}
          load: true
          push: false
          tags: yazilansari/${{ inputs.service }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan Docker image with Trivy
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: yazilansari/${{ inputs.service }}:${{ github.sha }}
          format: table
          exit-code: 0
          severity: CRITICAL,HIGH
          ignore-unfixed: true

      - name: Push Docker image
        run: docker push yazilansari/${{ inputs.service }}:${{ github.sha }}