name: CI Pipeline

on:
  push:
    branches: [dev]
    paths:
      - 'nextjs-app/**'
      - 'auth-service/**'
      - 'orders-service/**'
      - 'payment-service/**'
      - 'products-service/**'
      - 'k8s/**'

permissions:
  contents: write

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      changed_services: ${{ steps.set-outputs.outputs.changed_services }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history required for accurate diff

      - name: Install jq
        run: sudo apt update && sudo apt install jq -y

      - name: Detect changed services
        id: set-outputs
        run: |
          CHANGED=($(git diff --name-only HEAD~1 HEAD | awk -F/ '{if (NF > 1) print $1}' | sort -u | grep -E '^(nextjs-app|.*-service)$'))
          
          changed_json=$(printf '%s\n' "${CHANGED[@]}" | jq -R . | jq -c -s .)
          echo "changed_services=$changed_json" >> $GITHUB_OUTPUT

      - name: Debug changed services
        run: |
          echo "Changed services: ${{ steps.set-outputs.outputs.changed_services }}"

  build-services:
    needs: changes
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJson(needs.changes.outputs.changed_services) }}
    uses: ./.github/workflows/build-service.yml
    with:
      service: ${{ matrix.service }}
    secrets:
      DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
      DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}

  update-k8s:
    needs: [changes, build-services]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - uses: actions/checkout@v4

      - name: Install jq
        run: sudo apt update && sudo apt install jq -y

      - name: Update deployment image tags
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Updating K8s deployment files..."
          
          CHANGED_SERVICES=$(echo '${{ needs.changes.outputs.changed_services }}' | jq -r '.[]')
          
          UPDATED=false
          
          for service in $CHANGED_SERVICES; do
            REPO="yazilansari/$service"
            TAG="${{ github.sha }}"
            
            TOKEN=$(curl -s "https://auth.docker.io/token?service=registry.docker.io&scope=repository:$REPO:pull" | jq -r .token)
            
            HTTP_CODE=$(curl --silent --output /dev/null --write-out "%{http_code}" \
              --header "Authorization: Bearer $TOKEN" \
              --header "Accept: application/vnd.docker.distribution.manifest.v2+json" \
              "https://registry-1.docker.io/v2/$REPO/manifests/$TAG")
            
            if [ "$HTTP_CODE" = "200" ]; then
              PREFIX="${service%-service}"
              if [ "$PREFIX" = "$service" ]; then
                PREFIX="${service%-app}"
              fi
              
              DEP_FILE="k8s/$PREFIX-deployment.yaml"
              
              sed -i "s|yazilansari\/$service:.*|yazilansari/$service:$TAG|" $DEP_FILE
              UPDATED=true
            fi
          done
          
          if [ "$UPDATED" = "true" ]; then
            git config --global user.name 'Yazil Ansari'
            git config --global user.email 'yazilansari03@gmail.com'
            git add k8s/*.yaml
            git commit -m "Update deployment image tags to ${{ github.sha }}" || echo "No changes to commit"
            git push
          fi