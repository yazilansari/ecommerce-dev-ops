name: CI Pipeline

on:
  push:
    branches: [dev]
    paths:
      - 'nextjs-app/**'
      - 'auth-service/**'
      - 'orders-service/**'
      - 'payment-service/**'
      - 'products-service/**'
      - 'k8s/**'
      - '.github/workflows/**'

permissions:
  contents: write

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      nextjs: ${{ steps.set-outputs.outputs.nextjs }}
      auth: ${{ steps.set-outputs.outputs.auth }}
      orders: ${{ steps.set-outputs.outputs.orders }}
      payment: ${{ steps.set-outputs.outputs.payment }}
      products: ${{ steps.set-outputs.outputs.products }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history required for accurate diff

      - name: Detect changed services
        id: set-outputs
        run: |
          NEXTJS=false
          AUTH=false
          ORDERS=false
          PAYMENT=false
          PRODUCTS=false

          for file in $(git diff --name-only HEAD~1 HEAD); do
            case "$file" in
              nextjs-app/*) NEXTJS=true ;;
              auth-service/*) AUTH=true ;;
              orders-service/*) ORDERS=true ;;
              payment-service/*) PAYMENT=true ;;
              products-service/*) PRODUCTS=true ;;
            esac
          done

          echo "nextjs=$NEXTJS" >> $GITHUB_OUTPUT
          echo "auth=$AUTH" >> $GITHUB_OUTPUT
          echo "orders=$ORDERS" >> $GITHUB_OUTPUT
          echo "payment=$PAYMENT" >> $GITHUB_OUTPUT
          echo "products=$PRODUCTS" >> $GITHUB_OUTPUT

      - name: Debug changed services
        run: |
          echo "NextJS changed: ${{ steps.set-outputs.outputs.nextjs }}"
          echo "Auth changed: ${{ steps.set-outputs.outputs.auth }}"
          echo "Orders changed: ${{ steps.set-outputs.outputs.orders }}"
          echo "Payment changed: ${{ steps.set-outputs.outputs.payment }}"
          echo "Products changed: ${{ steps.set-outputs.outputs.products }}"

  build-nextjs:
    if: ${{ needs.changes.outputs.nextjs == 'true' }}
    needs: changes
    uses: ./.github/workflows/build-service.yml
    with:
      service: nextjs-app
    secrets:
      DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
      DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}

  build-auth:
    if: ${{ needs.changes.outputs.auth == 'true' }}
    needs: changes
    uses: ./.github/workflows/build-service.yml
    with:
      service: auth-service
    secrets:
      DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
      DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}

  build-orders:
    if: ${{ needs.changes.outputs.orders == 'true' }}
    needs: changes
    uses: ./.github/workflows/build-service.yml
    with:
      service: orders-service
    secrets:
      DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
      DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}

  build-payment:
    if: ${{ needs.changes.outputs.payment == 'true' }}
    needs: changes
    uses: ./.github/workflows/build-service.yml
    with:
      service: payment-service
    secrets:
      DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
      DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}

  build-products:
    if: ${{ needs.changes.outputs.products == 'true' }}
    needs: changes
    uses: ./.github/workflows/build-service.yml
    with:
      service: products-service
    secrets:
      DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
      DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}

  update-k8s:
  needs: [build-nextjs, build-auth, build-orders, build-payment, build-products]
  runs-on: ubuntu-latest
  # Run only if at least one service was built successfully
  if: |
    needs.build-nextjs.outcome == 'success' ||
    needs.build-auth.outcome == 'success' ||
    needs.build-orders.outcome == 'success' ||
    needs.build-payment.outcome == 'success' ||
    needs.build-products.outcome == 'success'
  steps:
    - uses: actions/checkout@v4
    - name: Update deployment image tags
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        echo "Updating K8s deployment files..."
        if [ "${{ needs.build-nextjs.outcome }}" == "success" ]; then
          sed -i "s|yazilansari/nextjs-app:.*|yazilansari/nextjs-app:${{ github.sha }}|" k8s/nextjs-deployment.yaml
        fi
        if [ "${{ needs.build-auth.outcome }}" == "success" ]; then
          sed -i "s|yazilansari/auth-service:.*|yazilansari/auth-service:${{ github.sha }}|" k8s/auth-deployment.yaml
        fi
        if [ "${{ needs.build-orders.outcome }}" == "success" ]; then
          sed -i "s|yazilansari/orders-service:.*|yazilansari/orders-service:${{ github.sha }}|" k8s/orders-deployment.yaml
        fi
        if [ "${{ needs.build-payment.outcome }}" == "success" ]; then
          sed -i "s|yazilansari/payment-service:.*|yazilansari/payment-service:${{ github.sha }}|" k8s/payment-deployment.yaml
        fi
        if [ "${{ needs.build-products.outcome }}" == "success" ]; then
          sed -i "s|yazilansari/products-service:.*|yazilansari/products-service:${{ github.sha }}|" k8s/products-deployment.yaml
        fi

        git config --global user.name 'Yazil Ansari'
        git config --global user.email 'yazilansari03@gmail.com'
        git add k8s/*.yaml
        git commit -m "Update deployment image tags to ${{ github.sha }}" || echo "No changes to commit"
        git push

