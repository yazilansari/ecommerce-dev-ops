name: CI Pipeline

on:
  push:
    branches: [dev]
    paths:
      - 'nextjs-app/**'
      - 'auth-service/**'
      - 'orders-service/**'
      - 'payment-service/**'
      - 'products-service/**'
      - 'k8s/**'

permissions:
  contents: write

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.set-outputs.outputs.services }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history required for accurate diff

      - name: Detect changed services
        id: set-outputs
        run: |
          SERVICES=()
          for file in $(git diff --name-only HEAD~1 HEAD); do
            case "$file" in
              nextjs-app/*) SERVICES+=("nextjs-app") ;;
              auth-service/*) SERVICES+=("auth-service") ;;
              orders-service/*) SERVICES+=("orders-service") ;;
              payment-service/*) SERVICES+=("payment-service") ;;
              products-service/*) SERVICES+=("products-service") ;;
            esac
          done
          # Remove duplicates and convert to JSON array for matrix
          if [ ${#SERVICES[@]} -eq 0 ]; then
            UNIQUE_SERVICES="[]"
          else
            UNIQUE_SERVICES=$(printf '%s\n' "${SERVICES[@]}" | sort -u | jq -s -R 'split("\n") | map(select(. != ""))')
          fi
          echo "services=$UNIQUE_SERVICES" >> $GITHUB_OUTPUT

      - name: Debug changed services
        run: |
          echo "Changed services: ${{ steps.set-outputs.outputs.services }}"

  build-services:
    needs: changes
    if: ${{ needs.changes.outputs.services != '[]' }}
    strategy:
      matrix:
        service: ${{ fromJson(needs.changes.outputs.services) }}
    uses: ./.github/workflows/build-service.yml
    with:
      service: ${{ matrix.service }}
    secrets: inherit

  update-k8s:
    needs: [build-services]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - uses: actions/checkout@v4
      - name: Update deployment image tags
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Updating K8s deployment files..."
          SERVICES=(${needs.changes.outputs.services//[\[\]\",]/ })
          for service in "${SERVICES[@]}"; do
            if [ -n "$service" ]; then
              sed -i "s|yazilansari/$service:.*|yazilansari/$service:${{ github.sha }}|" k8s/${service}-deployment.yaml
            fi
          done

          git config --global user.name 'Yazil Ansari'
          git config --global user.email 'yazilansari03@gmail.com'
          git add k8s/*.yaml
          git commit -m "Update deployment image tags to ${{ github.sha }}" || echo "No changes to commit"
          git push