name: CI Pipeline

on:
  push:
    branches: [dev]
    paths:
      - 'nextjs-app/**'
      - 'auth-service/**'
      - 'orders-service/**'
      - 'payment-service/**'
      - 'products-service/**'
      - 'k8s/**'

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      nextjs: ${{ steps.filter.outputs.nextjs }}
      auth: ${{ steps.filter.outputs.auth }}
      orders: ${{ steps.filter.outputs.orders }}
      payment: ${{ steps.filter.outputs.payment }}
      products: ${{ steps.filter.outputs.products }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            nextjs:
              - 'nextjs-app/**'
            auth:
              - 'auth-service/**'
            orders:
              - 'orders-service/**'
            payment:
              - 'payment-service/**'
            products:
              - 'products-service/**'

  build-and-test:
    needs: changes
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [nextjs-app, auth-service, orders-service, payment-service, products-service]
        include:
          - service: nextjs-app
            key: nextjs
          - service: auth-service
            key: auth
          - service: orders-service
            key: orders
          - service: payment-service
            key: payment
          - service: products-service
            key: products

    steps:
      - uses: actions/checkout@v4

      - name: Stop if service not changed
        if: needs.changes.outputs[matrix.key] != 'true'
        run: |
          echo "No changes in ${{ matrix.service }}, skipping..."
          exit 0

      - name: Set up Node.js
        if: needs.changes.outputs[matrix.key] == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Cache Node.js dependencies
        if: needs.changes.outputs[matrix.key] == 'true'
        uses: actions/cache@v4
        with:
          path: ${{ matrix.service }}/node_modules
          key: ${{ runner.os }}-${{ hashFiles(format('{0}/package-lock.json', matrix.service)) }}

      - name: Install and Test
        if: needs.changes.outputs[matrix.key] == 'true'
        run: |
          cd ${{ matrix.service }}
          npm install
          npm test

      - name: Set up Docker Buildx
        if: needs.changes.outputs[matrix.key] == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: needs.changes.outputs[matrix.key] == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Scan Docker image
        if: needs.changes.outputs[matrix.key] == 'true'
        uses: docker/build-push-action@v5
        with:
          context: ./${{ matrix.service }}
          push: false
          tags: yazilansari/${{ matrix.service }}:${{ github.sha }}
          cache-from: type=registry,ref=yazilansari/${{ matrix.service }}:cache
          cache-to: type=registry,ref=yazilansari/${{ matrix.service }}:cache,mode=max

      - name: Scan image with Trivy
        if: needs.changes.outputs[matrix.key] == 'true'
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: yazilansari/${{ matrix.service }}:${{ github.sha }}
          format: table
          exit-code: 0
          severity: CRITICAL,HIGH
          ignore-unfixed: true

      - name: Push image
        if: needs.changes.outputs[matrix.key] == 'true'
        uses: docker/build-push-action@v5
        with:
          context: ./${{ matrix.service }}
          push: true
          tags: yazilansari/${{ matrix.service }}:${{ github.sha }}
          cache-from: type=registry,ref=yazilansari/${{ matrix.service }}:cache
          cache-to: type=registry,ref=yazilansari/${{ matrix.service }}:cache,mode=max

  update-k8s:
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update deployment image tags
        run: |
          sed -i "s|yazilansari/nextjs-app:.*|yazilansari/nextjs-app:${{ github.sha }}|" k8s/nextjs-deployment.yaml
          sed -i "s|yazilansari/auth-service:.*|yazilansari/auth-service:${{ github.sha }}|" k8s/auth-deployment.yaml
          sed -i "s|yazilansari/orders-service:.*|yazilansari/orders-service:${{ github.sha }}|" k8s/orders-deployment.yaml
          sed -i "s|yazilansari/payment-service:.*|yazilansari/payment-service:${{ github.sha }}|" k8s/payment-deployment.yaml
          sed -i "s|yazilansari/products-service:.*|yazilansari/products-service:${{ github.sha }}|" k8s/products-deployment.yaml

      - name: Commit and push updated manifests
        run: |
          git config --global user.name 'Yazil Ansari'
          git config --global user.email 'yazilansari03@gmail.com'
          git add k8s/*.yaml
          git commit -m "Update deployment image tags to ${{ github.sha }}" || echo "No changes to commit"
          git push
