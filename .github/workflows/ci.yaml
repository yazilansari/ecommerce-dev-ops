name: CI Pipeline

on:
  push:
    branches: [dev]
    paths:
      - 'nextjs-app/**'
      - 'auth-service/**'
      - 'orders-service/**'
      - 'payment-service/**'
      - 'products-service/**'
      - 'k8s/**'

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      nextjs: ${{ steps.filter.outputs.nextjs }}
      auth: ${{ steps.filter.outputs.auth }}
      orders: ${{ steps.filter.outputs.orders }}
      payment: ${{ steps.filter.outputs.payment }}
      products: ${{ steps.filter.outputs.products }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            nextjs:
              - 'nextjs-app/**'
            auth:
              - 'auth-service/**'
            orders:
              - 'orders-service/**'
            payment:
              - 'payment-service/**'
            products:
              - 'products-service/**'

  # -------- NEXTJS APP --------
  build-nextjs:
    needs: changes
    if: needs.changes.outputs.nextjs == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
      - uses: actions/cache@v4
        with:
          path: nextjs-app/node_modules
          key: ${{ runner.os }}-${{ hashFiles('nextjs-app/package-lock.json') }}
      - run: |
          cd nextjs-app
          npm install
          npm test
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - uses: docker/build-push-action@v5
        with:
          context: ./nextjs-app
          push: true
          tags: yazilansari/nextjs-app:${{ github.sha }}
          cache-from: type=registry,ref=yazilansari/nextjs-app:cache
          cache-to: type=registry,ref=yazilansari/nextjs-app:cache,mode=max
      - uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: yazilansari/nextjs-app:${{ github.sha }}
          format: table
          exit-code: 0
          severity: CRITICAL,HIGH
          ignore-unfixed: true

  # -------- AUTH SERVICE --------
  build-auth:
    needs: changes
    if: needs.changes.outputs.auth == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
      - uses: actions/cache@v4
        with:
          path: auth-service/node_modules
          key: ${{ runner.os }}-${{ hashFiles('auth-service/package-lock.json') }}
      - run: |
          cd auth-service
          npm install
          npm test
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - uses: docker/build-push-action@v5
        with:
          context: ./auth-service
          push: true
          tags: yazilansari/auth-service:${{ github.sha }}
          cache-from: type=registry,ref=yazilansari/auth-service:cache
          cache-to: type=registry,ref=yazilansari/auth-service:cache,mode=max
      - uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: yazilansari/auth-service:${{ github.sha }}
          format: table
          exit-code: 0
          severity: CRITICAL,HIGH
          ignore-unfixed: true

  # -------- ORDERS SERVICE --------
  build-orders:
    needs: changes
    if: needs.changes.outputs.orders == 'true'
    runs-on: ubuntu-latest
    steps:
      # same pattern as above...

  # -------- PAYMENT SERVICE --------
  build-payment:
    needs: changes
    if: needs.changes.outputs.payment == 'true'
    runs-on: ubuntu-latest
    steps:
      # same pattern as above...

  # -------- PRODUCTS SERVICE --------
  build-products:
    needs: changes
    if: needs.changes.outputs.products == 'true'
    runs-on: ubuntu-latest
    steps:
      # same pattern as above...

  # -------- UPDATE K8S DEPLOYMENTS --------
  update-k8s:
    needs: [build-nextjs, build-auth, build-orders, build-payment, build-products]
    runs-on: ubuntu-latest
    if: always() && (needs.build-nextjs.result == 'success' || needs.build-auth.result == 'success' || needs.build-orders.result == 'success' || needs.build-payment.result == 'success' || needs.build-products.result == 'success')
    steps:
      - uses: actions/checkout@v4
      - run: |
          sed -i "s|yazilansari/nextjs-app:.*|yazilansari/nextjs-app:${{ github.sha }}|" k8s/nextjs-deployment.yaml
          sed -i "s|yazilansari/auth-service:.*|yazilansari/auth-service:${{ github.sha }}|" k8s/auth-deployment.yaml
          sed -i "s|yazilansari/orders-service:.*|yazilansari/orders-service:${{ github.sha }}|" k8s/orders-deployment.yaml
          sed -i "s|yazilansari/payment-service:.*|yazilansari/payment-service:${{ github.sha }}|" k8s/payment-deployment.yaml
          sed -i "s|yazilansari/products-service:.*|yazilansari/products-service:${{ github.sha }}|" k8s/products-deployment.yaml
      - run: |
          git config --global user.name 'Yazil Ansari'
          git config --global user.email 'yazilansari03@gmail.com'
          git add k8s/*.yaml
          git commit -m "Update deployment image tags to ${{ github.sha }}" || echo "No changes to commit"
          git push
