name: CI Pipeline

on:
  push:
    branches: [dev]
    paths:
      - 'nextjs-app/**'
      - 'auth-service/**'
      - 'orders-service/**'
      - 'payment-service/**'
      - 'products-service/**'
      - 'k8s/**'
      - '.github/workflows/**'

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      nextjs: ${{ steps.filter.outputs.nextjs }}
      auth: ${{ steps.filter.outputs.auth }}
      orders: ${{ steps.filter.outputs.orders }}
      payment: ${{ steps.filter.outputs.payment }}
      products: ${{ steps.filter.outputs.products }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            nextjs:
              - 'nextjs-app/**'
            auth:
              - 'auth-service/**'
            orders:
              - 'orders-service/**'
            payment:
              - 'payment-service/**'
            products:
              - 'products-service/**'

  build-nextjs:
    needs: changes
    if: needs.changes.outputs.nextjs == 'true'
    uses: ./.github/workflows/build-service.yml
    with:
      service: nextjs-app
      path: nextjs-app
      docker_tag: yazilansari/nextjs-app:${{ github.sha }}

  build-auth:
    needs: changes
    if: needs.changes.outputs.auth == 'true'
    uses: ./.github/workflows/build-service.yml
    with:
      service: auth-service
      path: auth-service
      docker_tag: yazilansari/auth-service:${{ github.sha }}

  build-orders:
    needs: changes
    if: needs.changes.outputs.orders == 'true'
    uses: ./.github/workflows/build-service.yml
    with:
      service: orders-service
      path: orders-service
      docker_tag: yazilansari/orders-service:${{ github.sha }}

  build-payment:
    needs: changes
    if: needs.changes.outputs.payment == 'true'
    uses: ./.github/workflows/build-service.yml
    with:
      service: payment-service
      path: payment-service
      docker_tag: yazilansari/payment-service:${{ github.sha }}

  build-products:
    needs: changes
    if: needs.changes.outputs.products == 'true'
    uses: ./.github/workflows/build-service.yml
    with:
      service: products-service
      path: products-service
      docker_tag: yazilansari/products-service:${{ github.sha }}

  update-k8s:
    needs: [build-nextjs, build-auth, build-orders, build-payment, build-products]
    runs-on: ubuntu-latest
    if: always() && (needs.build-nextjs.result == 'success' || needs.build-auth.result == 'success' || needs.build-orders.result == 'success' || needs.build-payment.result == 'success' || needs.build-products.result == 'success')
    steps:
      - uses: actions/checkout@v4
      - run: |
          sed -i "s|yazilansari/nextjs-app:.*|yazilansari/nextjs-app:${{ github.sha }}|" k8s/nextjs-deployment.yaml
          sed -i "s|yazilansari/auth-service:.*|yazilansari/auth-service:${{ github.sha }}|" k8s/auth-deployment.yaml
          sed -i "s|yazilansari/orders-service:.*|yazilansari/orders-service:${{ github.sha }}|" k8s/orders-deployment.yaml
          sed -i "s|yazilansari/payment-service:.*|yazilansari/payment-service:${{ github.sha }}|" k8s/payment-deployment.yaml
          sed -i "s|yazilansari/products-service:.*|yazilansari/products-service:${{ github.sha }}|" k8s/products-deployment.yaml
      - run: |
          git config --global user.name 'Yazil Ansari'
          git config --global user.email 'yazilansari03@gmail.com'
          git add k8s/*.yaml
          git commit -m "Update deployment image tags to ${{ github.sha }}" || echo "No changes to commit"
          git push
