apiVersion: apps/v1
kind: Deployment
metadata:
  name: nextjs-deployment
  namespace: ecommerce  # Specify the namespace here
spec:
  replicas: 2
  selector:
    matchLabels:
      app: nextjs
  template:
    metadata:
      labels:
        app: nextjs
    spec:
      containers:
      - name: nextjs
        image: yazilansari/nextjs-app:5d67e9da580f1ad5ccd417010769a8315e6effb0
        imagePullPolicy: Always
        ports:
        - containerPort: 3000
        env:
        - name: NEXT_PUBLIC_PRODUCTS_API_URL
          value: "http://api.192-168-28-130.nip.io/products"
        - name: NEXT_PUBLIC_ORDERS_API_URL
          value: "http://api.192-168-28-130.nip.io/orders"
        - name: NEXT_PUBLIC_PAYMENT_API_URL
          value: "http://api.192-168-28-130.nip.io/payment"
        - name: NEXT_PUBLIC_AUTH_API_URL
          value: "http://api.192-168-28-130.nip.io/auth/signin"
        resources:
          limits:
            cpu: "500m"
            memory: "512Mi"
          requests:
            cpu: "200m"
            memory: "256Mi"
