apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mysql
  namespace: ecommerce    # Add your namespace here if not default
spec:
  serviceName: mysql-service
  replicas: 1
  selector:
    matchLabels:
      app: mysql
  template:
    metadata:
      labels:
        app: mysql
    spec:
      containers:
      - name: mysql
        image: mysql:8
        ports:
        - containerPort: 3306
        env:
        - name: MYSQL_ALLOW_EMPTY_PASSWORD
          value: "true" # Allow empty root password
        - name: MYSQL_USER
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: DB_USER
        - name: MYSQL_PASSWORD
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: DB_PASSWORD
        - name: MYSQL_DATABASE
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: DB_NAME
        volumeMounts:
        - name: mysql-data
          mountPath: /var/lib/mysql
        resources:
          limits:
            cpu: "500m"
            memory: "1Gi"
          requests:
            cpu: "200m"
            memory: "512Mi"
      - name: mysql-schema-sidecar
        image: mysql:8
        env:
        - name: MYSQL_ROOT_PASSWORD
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: DB_PASSWORD  # Adjust if your root password is stored differently
        - name: MYSQL_DATABASE
          value: ecommerce_db
        - name: MYSQL_USER
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: DB_USER
        command: ["sh", "-c"]
        args:
          - |
            echo "Waiting for MySQL to be ready...";
            until mysql -h 127.0.0.1 -u${MYSQL_USER} -p${MYSQL_ROOT_PASSWORD} -e "SELECT 1"; do
              sleep 2;
            done;
            echo "Creating database and tables...";
            mysql -h 127.0.0.1 -u${MYSQL_USER} -p${MYSQL_ROOT_PASSWORD} <<EOF
            CREATE DATABASE IF NOT EXISTS \`${MYSQL_DATABASE}\`;
            USE \`${MYSQL_DATABASE}\`;

            CREATE TABLE IF NOT EXISTS products (
              id INT AUTO_INCREMENT PRIMARY KEY,
              name VARCHAR(255) NOT NULL,
              description TEXT,
              price DECIMAL(10,2) NOT NULL
            );

            INSERT INTO products (name, description, price) VALUES
              ('Laptop', 'A high-performance laptop.', 1200.00),
              ('Smartphone', 'Latest model smartphone.', 799.99),
              ('Headphones', 'Noise-cancelling headphones.', 199.50)
            ON DUPLICATE KEY UPDATE name=VALUES(name);

            CREATE TABLE IF NOT EXISTS orders (
              id INT AUTO_INCREMENT PRIMARY KEY,
              user_id INT NOT NULL,
              product_id INT NOT NULL,
              quantity INT DEFAULT 1,
              status VARCHAR(50) DEFAULT 'pending'
            );
            EOF
            echo "Schema and data setup complete. Sidecar sleeping...";
            tail -f /dev/null
        volumeMounts:
        - name: mysql-data
          mountPath: /var/lib/mysql

  volumeClaimTemplates:
  - metadata:
      name: mysql-data
    spec:
      accessModes: ["ReadWriteOnce"]
      resources:
        requests:
          storage: 1Gi
